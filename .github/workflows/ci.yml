# Checks every push, to any branch, and every pull request (plans/testing.md, D2 and D7).
# Screenshot tests are left out: their baselines are Windows renders (D8).
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings=0
      - run: npm test

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository secrets. The build needs the Supabase pair; without the test account's
      # pair, the specs that need an account skip.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Lets the server count calls, and counts guest calls against the test account.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USAGE_USER_ID: ${{ secrets.E2E_USAGE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      # Kept a few days only, and only when something failed (D3).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
