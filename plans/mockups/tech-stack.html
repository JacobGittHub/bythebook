body { background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1040px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 16px; }

.flows { display: flex; flex-wrap: wrap; gap: 6px; }
.flows button {

.flows button:hover { border-color: var(--accent); }

.caption { margin: 0; min-height: 3em; padding: 8px 12px; background: var(--accent-wash); border-left: 3px solid var(--accent); max-width: 80ch; }

figure { margin: 0; }

svg { display: block; width: 100%; min-width: 820px; height: auto; font-family: var(--display); }
.zone rect { fill: var(--zone); stroke: var(--line-strong); stroke-width: 1; }
.zone.dashed rect { stroke-dasharray: 5 4; }
.zl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; fill: var(--ink-soft); }
.node rect { fill: var(--panel); stroke: var(--line-strong); stroke-width: 1; }
.node.ext rect { stroke-dasharray: 4 3; }
.nt { font-size: 12px; font-weight: 600; fill: var(--ink); }
.ns { font-size: 11px; fill: var(--ink-soft); }
.edge path { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; marker-end: url(#arrow); }
.edge.dashed path { stroke-dasharray: 5 4; }
.el { font-size: 10.5px; fill: var(--ink-soft); }
.node, .edge { transition: opacity 0.15s; }
.dim { opacity: 0.2; }
.node.on rect { stroke: var(--accent); stroke-width: 2; }

.edge.on .el { fill: var(--accent); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .node, .edge { transition: none; } }

<script>
var FLOWS = {
  'all': 'All the paths at once. Solid lines are runtime calls; dashed lines are scripts you run locally. Pick a path to follow it.',
  'ex-signed': 'Signed-in explorer request: the proxy checks the session, the route handler counts the call and reads position_cache. Only a cache miss goes on to Lichess.',
  'ex-guest': 'Guest explorer request: the same route, but it reads position_cache only. The Lichess line stays dark because a guest request must never reach Lichess.',
  'bk-guest': 'Guest opens a book: useLibrary() reads IndexedDB in the browser. No request leaves the page.',
  'bk-account': 'Signed-in user saves a book: useLibrary() calls /api/openings/books, the handler replays every move to validate it, and one row in opening_books is written.',
  'prefill': 'Cache pre-fill: a script on your machine calls Lichess for the whole catalog and writes position_cache directly. It never runs on Vercel.'
};
var caption = document.getElementById('caption');
var buttons = document.querySelectorAll('.flows button');
function setFlow(id) {
  document.querySelectorAll('svg [data-f]').forEach(function (el) {
    var inFlow = id === 'all' || el.getAttribute('data-f').split(' ').indexOf(id) !== -1;
    el.classList.toggle('dim', !inFlow);
    el.classList.toggle('on', id !== 'all' && inFlow);
  });
  buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-flow') === id)); });
  caption.textContent = FLOWS[id];
}
buttons.forEach(function (b) { b.addEventListener('click', function () { setFlow(b.getAttribute('data-flow')); }); });
setFlow('all');
</script>
